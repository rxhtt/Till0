services:
  postgres:
    image: postgres:16-alpine
    container_name: till0_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: till0
      POSTGRES_PASSWORD: till0_secret
      POSTGRES_DB: till0
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U till0 -d till0"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: till0_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://till0:till0_secret@postgres:5432/till0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
