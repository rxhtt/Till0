name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-packages:
    name: Lint, Typecheck, Unit & Property Tests, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architectural Boundaries & Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & Property Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  server:
    name: Server Lint, Mypy Strict, and Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: till0
          POSTGRES_PASSWORD: till0_secret
          POSTGRES_DB: till0
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://till0:till0_secret@localhost:5432/till0
      ADMIN_SECRET: till0_admin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Ruff Lint
        run: ruff check server/

      - name: Mypy Strict Typecheck
        run: mypy --config-file server/pyproject.toml server/

      - name: Pytest
        run: pytest server/tests
